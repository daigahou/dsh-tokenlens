name: Feature request
description: Suggest an idea for dsh-TokenLens (词元透镜)
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! Please describe the **problem** first and the proposed
        solution second — that makes it much easier to judge whether the change fits the
        project. Never paste API keys or personal usage data here.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What are you trying to do, and where does the plugin get in the way today?
      placeholder: |
        I want to ... but the dialog shows ... because ...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the behavior or UI you would like. Sketches and mockups are welcome.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      multiple: true
      options:
        - Provider plan capacity
        - Local token statistics
        - Dialog UI / chart view
        - Provider management page
        - Agent tool (tokenlens_usage)
        - New provider support
        - New harness (local data source) support
        - Performance
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches, workarounds, or how other tools solve this.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else that helps — provider documentation, API response shapes (redacted), screenshots.
    validations:
      required: false

  - type: checkboxes
    id: confirmations
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues and did not find a duplicate.
          required: true
        - label: I am willing to open a pull request for this.
          required: false
