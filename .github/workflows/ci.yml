# Continuous integration for dsh-TokenLens.
#
# The plugin has zero runtime dependencies, so no `npm install` is required:
# `node --test` discovers every `test/*.test.mjs` file by itself.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        node:
          - '24.x'
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Show tool versions
        run: |
          node --version
          npm --version

      - name: Run the test suite
        run: node --test

  pack:
    # Guard the publishable tarball: required files must be present, and local
    # research material (.dev/, .refs/, test/) must never leak into the package.
    name: Package check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Verify the publishable tarball
        run: |
          npm pack --dry-run --json > /tmp/tokenlens-pack.json
          node -e "const fs=require('fs'); const packed=JSON.parse(fs.readFileSync('/tmp/tokenlens-pack.json','utf8'))[0]; const paths=packed.files.map((f)=>f.path); const files=new Set(paths); const required=['index.js','client.js','cordis.patch.yml','lib/providers.mjs','README.md','CHANGELOG.md','LICENSE']; const missing=required.filter((f)=>!files.has(f)); const leaked=paths.filter((p)=>p.startsWith('.dev/')||p.startsWith('.refs/')||p.startsWith('test/')); if(missing.length>0){console.error('missing from npm tarball: '+missing.join(', ')); process.exit(1)} if(leaked.length>0){console.error('local-only files leaked into npm tarball: '+leaked.join(', ')); process.exit(1)} console.log('npm tarball OK: '+packed.filename+' ('+paths.length+' files)')"
