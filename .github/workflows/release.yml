# Publish dsh-TokenLens to npm when a version tag is pushed, then add that
# version to the DSH plugin market index (market/index.json).
#
#   git tag v1.0.5
#   git push origin v1.0.5
#
# Publishing uses npm Trusted Publishing (OIDC), so no token is stored here:
# configure the package's trusted publisher on npmjs.com for this repository and
# the workflow file name `release.yml`, and allow the "npm publish" action.
# Provenance needs `id-token: write` and a public repository. Updating the market
# index commits back to main, which needs `contents: write`.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v4

      - name: Set up Node.js and the npm registry
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Check that the tag matches package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node -e "const version=require('./package.json').version; const tag=process.env.TAG.replace(/^v/,''); if(version!==tag){console.error('package.json version '+version+' does not match tag '+tag); process.exit(1)} console.log('releasing v'+version)"

      - name: Run the test suite
        run: node --test

      - name: Publish with provenance
        run: npm publish --provenance --access public

      - name: Update the plugin market index
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git checkout -B market-index-update origin/main
          PUBLISH_TIMESTAMP=$(date +%s) node scripts/update-market-index.mjs "$REF_NAME"
          if git diff --quiet -- market/index.json; then
            echo 'market/index.json is already up to date'
            exit 0
          fi
          git add market/index.json
          git commit -m "chore(market): add $REF_NAME to the plugin market index"
          git push origin HEAD:main
